<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Canvas Deadline Helper</title>
  <style>
    body {
      font-family: sans-serif;
      width: 260px;
      padding: 10px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 8px 0;
    }
    p {
      font-size: 13px;
      margin: 0;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      padding: 6px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    li:last-child {
      border-bottom: none;
    }
    .assignment-name {
      font-size: 13px;
      font-weight: bold;
    }
    .assignment-due {
      font-size: 12px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>Canvas Deadline Helper</h1>
  <p id="message"></p>
  <ul id="assignment-list"></ul>
  <script src="popup.js"></script>
</body>
</html>
